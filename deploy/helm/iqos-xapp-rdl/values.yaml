# Values para iqos-xapp-rdl Fase 2 (CA-RDL / MARL)
image:
  repository: iqos-xapp-rdl
  tag: 2.0.0
  pullPolicy: Never

replicaCount: 1

service:
  http:
    port: 8080
    metricsPort: 8081
  rmr:
    dataPort: 4560
    routePort: 4561

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  useFakeSdl: "true"
  rmrWaitForReady: "false"
  enableTorch: "true"
  marlAgents: "2"
  marlObsDim: "10"
  marlActionDim: "5"
  wQos: "0.6"
  wEe: "0.3"
  wPen: "0.1"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 5

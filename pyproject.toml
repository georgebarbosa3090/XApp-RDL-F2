[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xapp-rdl-f2"
version = "2.1.0"
description = "RDL-N2 (Fase 2): arbitragem aprendida (MAPPO com restrição) sobre o núcleo RDL-N1 da Fase 1"
authors = [{ name = "George Barbosa" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Núcleo RDL-N1 (percepção, TVS/EEVS, Safety Guard, grafo de conhecimento, A1, E2):
    # fonte única na Fase 1, fixada por commit. Para desenvolvimento local:
    #   uv pip install -e ../XApp-RDL-F1
    "xapp-rdl-f1 @ git+https://github.com/georgebarbosa3090/XApp-RDL-F1@9fefbff6",
    "numpy>=1.24.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-cov>=4.1.0"]

[tool.setuptools]
packages = ["cardl", "cardl.marl"]

[tool.setuptools.package-data]
cardl = ["calibration/*.json"]

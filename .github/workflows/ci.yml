name: CI - RDL xApp

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install RMR C Libraries
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends curl dpkg gcc python3-dev
        curl -sL https://packagecloud.io/o-ran-sc/release/packages/debian/stretch/rmr_4.9.0_amd64.deb/download.deb -o rmr_4.9.0_amd64.deb || true
        if [ -s rmr_4.9.0_amd64.deb ]; then sudo dpkg -i --force-depends rmr_4.9.0_amd64.deb || sudo apt-get install -f -y; fi
        curl -sL https://packagecloud.io/o-ran-sc/release/packages/debian/stretch/rmr-dev_4.9.0_amd64.deb/download.deb -o rmr-dev_4.9.0_amd64.deb || true
        if [ -s rmr-dev_4.9.0_amd64.deb ]; then sudo dpkg -i --force-depends rmr-dev_4.9.0_amd64.deb || sudo apt-get install -f -y; fi
        sudo ldconfig || true
        rm -f *.deb
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pytest-env
        
    - name: Run test suite
      env:
        PYTHONPATH: .
        USE_FAKE_SDL: "True"
        LD_LIBRARY_PATH: "/usr/local/lib:/usr/lib"
      run: |
        pytest tests/ -v
        
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t muriloavlis/iqos-xapp:latest -f docker/Dockerfile .

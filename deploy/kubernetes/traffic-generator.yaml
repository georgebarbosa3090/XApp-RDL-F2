apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: ricxapp
  labels:
    app: traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
      - name: generator
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Iniciando gerador de carga continuo multi-xApp para a malha Istio/Kiali..."
          ENDPOINTS="
          http://ricxapp-iqos-xapp-rdl-http:8080/health
          http://ricxapp-iqos-xapp-rdl-http:8081/metrics
          http://ricxapp-iqos-xapp-rdl-f2-http:8080/health
          http://ricxapp-iqos-xapp-rdl-f2-http:8081/metrics
          http://ricxapp-qos-xslice-http:8082/health
          http://ricxapp-qos-xslice-http:8083/metrics
          http://ricxapp-energy-saving-http:8084/health
          http://ricxapp-energy-saving-http:8085/metrics
          http://ricxapp-traffic-steering-http:8086/health
          http://ricxapp-traffic-steering-http:8087/metrics
          http://ricxapp-beamformer:8088/health
          http://ricxapp-beamformer:8089/metrics
          http://ricxapp-isac-radar:8090/health
          http://ricxapp-isac-radar:8091/metrics
          http://ricxapp-rogue-stress:8092/health
          http://ricxapp-rogue-stress:8093/metrics
          "
          while true; do
            for url in $ENDPOINTS; do
              curl -s --connect-timeout 1 "$url" >/dev/null 2>&1 || true
            done
            sleep 0.5
          done

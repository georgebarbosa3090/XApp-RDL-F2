name: CI-Scientific-Readiness - CA-RDL F2

# Gate de prontidão científica: só passa quando houver evidência elegível.
# Em 2026-11-10 não há nenhuma (ver docs/SANEAMENTO_20261110.md), então este
# workflow falha de propósito até que exista treino do MAPPO em ambiente real
# (manifesto com publication_eligible: true) e afirmações verificadas.

on:
  workflow_dispatch:
  push:
    tags:
      - 'f2-v*'

jobs:
  scientific-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pyyaml
      - name: Validate software evidence firewall
        run: |
          python scripts/check_no_synthetic_results.py
      - name: Require publication-eligible MAPPO training
        run: |
          python - <<'PY'
          import glob, json, sys
          manifests = glob.glob("experiments/training/*/training_manifest.json")
          eligible = [m for m in manifests if json.load(open(m, encoding="utf-8")).get("publication_eligible") is True]
          print(f"manifestos: {len(manifests)}, elegíveis: {len(eligible)}")
          sys.exit(0 if eligible else 1)
          PY
      - name: Require verified claims
        run: |
          python - <<'PY'
          import sys, yaml
          claims = yaml.safe_load(open("specs/claims.yaml", encoding="utf-8"))["claims"]
          pending = [c["id"] for c in claims if c.get("compliance_status") != "VERIFIED_EMPIRICAL"]
          print("afirmações sem verificação:", pending)
          sys.exit(1 if pending else 0)
          PY

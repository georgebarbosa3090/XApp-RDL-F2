name: CI-Scientific-Readiness - RDL-N2 F2

# Gate de prontidão científica: só passa quando houver evidência elegível (validação com E2
# real pré-registrada e afirmações verificadas). Falha de propósito até lá.

on:
  workflow_dispatch:
  push:
    tags:
      - 'f2-v*'

jobs:
  scientific-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - name: Exigir treino elegível para publicação
        run: |
          python - <<'PY'
          import glob, json, sys
          manifests = glob.glob("experiments/training/*/training_manifest.json")
          eligible = [m for m in manifests if json.load(open(m, encoding="utf-8")).get("publication_eligible") is True]
          print(f"manifestos: {len(manifests)}, elegíveis: {len(eligible)}")
          sys.exit(0 if eligible else 1)
          PY
      - name: Exigir afirmações verificadas
        run: |
          python - <<'PY'
          import sys, yaml
          claims = yaml.safe_load(open("specs/claims.yaml", encoding="utf-8"))["claims"]
          pending = [c["id"] for c in claims if c.get("compliance_status") != "VERIFIED_EMPIRICAL"]
          print("afirmações sem verificação:", pending)
          sys.exit(1 if pending else 0)
          PY

# Values para iqos-xapp-rdl Fase 2 (CA-RDL / MARL)
image:
  repository: iqos-xapp-rdl
  tag: 2.0.0
  pullPolicy: Never

replicaCount: 1

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/metrics"

service:
  http:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  metrics:
    port: 8081
    targetPort: 8081
  rmr:
    type: ClusterIP
    dataPort: 4560
    routePort: 4561

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  useFakeSdl: "false"
  rmrSeedRt: "/app/configs/routes.rt"
  configFile: "/app/configs/config-file.json"
  rmrWaitForReady: "false"
  logLevel: "INFO"
  enableTorch: "true"
  marlAgents: "2"
  marlObsDim: "10"
  marlActionDim: "5"
  wQos: "0.6"
  wEe: "0.3"
  wPen: "0.1"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 3
  periodSeconds: 5

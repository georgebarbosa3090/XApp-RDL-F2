name: CI-Scientific-Readiness - CA-RDL F2

on:
  workflow_dispatch:
  push:
    tags:
      - 'f2-v*'

jobs:
  scientific-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyyaml
      - name: Validate software evidence firewall
        run: |
          python scripts/check_no_synthetic_results.py
      - name: Validate CA-RDL ML provenance
        run: |
          python scripts/validate_ml_provenance.py --require-publication-data
      - name: Scientific readiness status
        run: |
          echo "=== CA-RDL F2 SCIENTIFIC READINESS PASS ==="
